<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adaptive bitrate · Lab 07</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/simulation.js" defer></script>
</head>
<body>
  <main>
    <header class="intro">
      <p class="lab">Lab 07 / Task 3</p>
      <h1>Adaptive bitrate</h1>
      <p class="instruction">Change the connection speed before each download. Play each result to hear when its buffer runs out.</p>
    </header>

    <section class="controls" aria-label="Simulation controls">
      <div class="range-control">
        <div class="control-heading">
          <label for="throughput">Throughput for the next segment</label>
          <output id="throughput-value" for="throughput">–</output>
        </div>
        <input id="throughput" type="range" disabled>
        <div class="limits" aria-hidden="true"><span id="throughput-min"></span><span id="throughput-max"></span></div>
      </div>
      <div class="actions">
        <button id="reset" type="button" disabled>Reset</button>
        <button id="next" type="button" disabled>Download next segment</button>
      </div>
    </section>
    <p id="error" role="alert" hidden></p>

    <section class="policies" aria-label="Policy comparison">
      <article class="policy" data-policy="adaptive" aria-live="polite">
        <h2 id="adaptive-heading">Adaptive bitrate</h2>
        <p class="buffer"><strong data-buffer>–</strong> <span>s buffered</span></p>
        <div class="buffer-track" aria-hidden="true"><div data-bar></div></div>
        <dl class="metrics">
          <div><dt>Bitrate</dt><dd data-encoding>–</dd></div>
          <div><dt>Download</dt><dd data-download>–</dd></div>
          <div><dt>Stall</dt><dd data-stall>–</dd></div>
        </dl>
        <audio controls preload="metadata" aria-labelledby="adaptive-heading"></audio>
      </article>
      <article class="policy" data-policy="fixed" aria-live="polite">
        <h2 id="fixed-heading">Fixed bitrate</h2>
        <p class="buffer"><strong data-buffer>–</strong> <span>s buffered</span></p>
        <div class="buffer-track" aria-hidden="true"><div data-bar></div></div>
        <dl class="metrics">
          <div><dt>Bitrate</dt><dd data-encoding>–</dd></div>
          <div><dt>Download</dt><dd data-download>–</dd></div>
          <div><dt>Stall</dt><dd data-stall>–</dd></div>
        </dl>
        <audio controls preload="metadata" aria-labelledby="fixed-heading"></audio>
      </article>
    </section>

    <section class="chart" aria-labelledby="chart-heading">
      <div class="chart-heading">
        <h2 id="chart-heading">Buffer over time</h2>
        <p id="progress" role="status">Loading simulation…</p>
      </div>
      <canvas id="buffer-plot" role="img" aria-label="Buffered audio over time for adaptive and fixed bitrate players"></canvas>
    </section>
    <noscript>Enable JavaScript to run the interactive comparison.</noscript>
  </main>
</body>
</html>
